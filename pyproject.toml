[project]
name = "docframe"
version = "0.1.0"
description = "Document analysis library from LDaCA, using polars backend"
authors = [
    {name = "Senhui (Alex) Guo", email = "senhui.guo@sydney.edu.au"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "spacy>=3.7.0",
    "nltk>=3.8",
    "scikit-learn>=1.6.1",
    "bertopic>=0.17.3",
    "fastexcel>=0.15.1",
    "pyarrow"
]

[project.optional-dependencies]
cpu = [
    "torch"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pandas"
]
